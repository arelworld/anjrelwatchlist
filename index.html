<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anjrel.mp4</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f8f5;
      --surface: #ffffff;
      --surface-alt: #f9fcfa;
      --surface-press: #f0f6f2;

      --border: #e4ede7;
      --border-strong: #d0e0d5;

      --text: #1c2b22;
      --text-2: #55685d;
      --text-3: #8ea196;

      --green: #6faf8a;
      --green-deep: #2e6b46;
      --green-soft: #e2f1e8;
      --green-wash: #f0f8f3;
      --green-glow: rgba(111, 175, 138, 0.22);

      --blue: #6a9bc4;
      --blue-soft: #e9f0f7;
      --orange: #c99656;
      --orange-soft: #faf1e4;
      --red: #cf7272;

      --shadow-xs: 0 1px 2px rgba(28, 43, 34, 0.04);
      --shadow-sm: 0 2px 6px rgba(28, 43, 34, 0.06);
      --shadow-md: 0 8px 24px rgba(28, 43, 34, 0.08);

      --r: 12px;
      --r-sm: 8px;
      --r-lg: 20px;

      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ============ HEADER ============ */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px 4px;
      gap: 12px;
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.8px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-3);
      transition: all 0.3s;
    }
    .dot.on {
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }

    .counter {
      font-size: 13px;
      color: var(--text-2);
      font-weight: 450;
      display: flex;
      gap: 12px;
    }
    .counter b {
      color: var(--green-deep);
      font-weight: 600;
    }

    /* ============ SEARCH + FILTERS ============ */
    .search {
      position: relative;
    }
    .search input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 14px 10px 38px;
      font-size: 14px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: all 0.15s;
    }
    .search input::placeholder { color: var(--text-3); }
    .search input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }
    .search svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-3);
      pointer-events: none;
    }

    .segments {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .segments::-webkit-scrollbar { display: none; }

    .seg {
      flex: 1;
      min-width: max-content;
      background: transparent;
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
      white-space: nowrap;
    }
    .seg:hover { color: var(--text); }
    .seg.on {
      background: var(--green-soft);
      color: var(--green-deep);
      font-weight: 600;
    }

    /* ============ LIST ============ */
    .list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }

    .row {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--surface-alt); }
    .row.open { background: var(--surface-alt); }

    /* collapsed row */
    .row-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .badge {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .name {
      font-size: 14.5px;
      font-weight: 550;
      color: var(--text);
      letter-spacing: -0.2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta .sep { opacity: 0.5; }

    .scores {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .score {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 34px;
    }
    .score span:first-child {
      font-size: 9px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .score span:last-child {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--green-deep);
      font-variant-numeric: tabular-nums;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pill::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .pill.will { background: var(--blue-soft); color: var(--blue); }
    .pill.will::before { background: var(--blue); }
    .pill.watching { background: var(--orange-soft); color: var(--orange); }
    .pill.watching::before { background: var(--orange); }
    .pill.watched { background: var(--green-soft); color: var(--green-deep); }
    .pill.watched::before { background: var(--green); }

    .chev {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-3);
      transition: transform 0.2s;
    }
    .row.open .chev { transform: rotate(180deg); }

    /* expanded editor */
    .editor {
      display: none;
      padding: 0 14px 16px 62px;
      gap: 12px;
      flex-direction: column;
    }
    .row.open .editor { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-3);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input.cell, select.cell, textarea.cell {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: 9px 11px;
      font-size: 13.5px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input.cell::placeholder, textarea.cell::placeholder { color: var(--text-3); }
    input.cell:hover, select.cell:hover, textarea.cell:hover { border-color: var(--border-strong); }
    input.cell:focus, select.cell:focus, textarea.cell:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }

    select.cell {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%238ea196' stroke-width='1.4' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position: right 11px center;
      padding-right: 30px;
    }

    /* ---- auto-growing textarea ---- */
    textarea.cell {
      resize: none;
      overflow: hidden;
      min-height: 40px;
      line-height: 1.5;
      display: block;
    }

    .reviewer-block {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: var(--green-wash);
      border: 1px solid var(--green-soft);
      border-radius: var(--r-sm);
    }
    .reviewer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .reviewer-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--green-deep);
      letter-spacing: -0.1px;
    }

    .editor-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 2px;
    }

    .del {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-3);
      font-size: 12.5px;
      font-weight: 500;
      font-family: var(--font);
      padding: 6px 12px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: all 0.15s;
    }
    .del:hover {
      color: var(--red);
      background: #fdf2f2;
      border-color: #f3d5d5;
    }

    /* ============ FLOATING ADD ============ */
    .fab {
      position: fixed;
      bottom: 22px;
      right: 22px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--green-deep);
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md), 0 0 0 4px rgba(46, 107, 70, 0.08);
      transition: all 0.2s;
      z-index: 10;
    }
    .fab:hover { transform: scale(1.06); background: var(--green); }
    .fab:active { transform: scale(0.96); }
    .fab svg { width: 24px; height: 24px; stroke-width: 2.2; }

    /* ============ ADD SHEET (modal) ============ */
    .sheet-bg {
      position: fixed;
      inset: 0;
      background: rgba(28, 43, 34, 0.35);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 20;
      padding: 0;
    }
    .sheet-bg.on { display: flex; }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 520px;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.22s ease-out;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-grip {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-strong);
      margin: 0 auto 4px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .sheet-submit {
      background: var(--green-deep);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }
    .sheet-submit:hover { background: var(--green); }
    .sheet-submit:active { transform: scale(0.99); }

    /* ============ EMPTY ============ */
    .empty {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-3);
      font-size: 13.5px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--r);
    }
    .empty b {
      display: block;
      color: var(--text-2);
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 520px) {
      .app { padding: 16px 12px 20px; }
      .title { font-size: 24px; }
      .row-head { padding: 11px 12px; gap: 10px; }
      .editor { padding-left: 12px; padding-right: 12px; }
      .grid2 { grid-template-columns: 1fr; }
      .scores { gap: 4px; }
      .score { min-width: 30px; }
      .pill { display: none; }
      .fab { bottom: 16px; right: 16px; }
    }
    @media (min-width: 521px) and (max-width: 720px) {
      .pill { font-size: 10px; padding: 3px 8px; }
    }
    @media (min-width: 721px) {
      .sheet-bg { align-items: center; padding: 20px; }
      .sheet { border-radius: var(--r-lg); max-width: 480px; }
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="top">
      <div class="title">
        anjrel.mp4
        <span class="dot" id="dot"></span>
      </div>
      <div class="counter">
        <span><b id="countTotal">0</b> total</span>
        <span><b id="countWatched">0</b> watched</span>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search..." />
    </div>

    <div class="segments" id="segments">
      <button class="seg on" data-filter="All">All</button>
      <button class="seg" data-filter="Will Watch">Will Watch</button>
      <button class="seg" data-filter="Still Watching">Watching</button>
      <button class="seg" data-filter="Watched">Watched</button>
    </div>

    <div class="list" id="list"></div>
    <div id="emptyState" class="empty" style="display:none;">
      <b>No entries yet</b>
      Tap the + button to add your first title.
    </div>
  </div>

  <button class="fab" id="fab" title="Add entry">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <div class="sheet-bg" id="sheetBg">
    <form class="sheet" id="addForm">
      <div class="sheet-grip"></div>
      <div class="sheet-title">New entry</div>

      <div class="field">
        <span class="label">Title</span>
        <input type="text" id="addTitle" class="cell" placeholder="Movie or show title" required />
      </div>

      <div class="grid2">
        <div class="field">
          <span class="label">Type</span>
          <select id="addType" class="cell">
            <option value="Movie">Movie</option>
            <option value="TV Show">TV Show</option>
            <option value="Anime">Anime</option>
          </select>
        </div>
        <div class="field">
          <span class="label">Genre</span>
          <select id="addGenre" class="cell">
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama" selected>Drama</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Thriller">Thriller</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Slice of Life">Slice of Life</option>
            <option value="Animation">Animation</option>
            <option value="Mystery">Mystery</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <span class="label">Status</span>
        <select id="addStatus" class="cell">
          <option value="Will Watch" selected>Will Watch</option>
          <option value="Still Watching">Still Watching</option>
          <option value="Watched">Watched</option>
        </select>
      </div>

      <button type="submit" class="sheet-submit">Add to watchlist</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://ziqgknxgdmkkcacwbbqz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcWdrbnhnZG1ra2NhY3diYnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzg4ODksImV4cCI6MjEwNzkxNDg4OX0.cfdK306XrPS5B7aVTc2Uux9HAhvmVw3jwD3GHff7ovs";

    let supabaseClient = null;
    let watchlistData = [];
    let currentFilter = 'All';
    let openId = null;

    const dot = document.getElementById('dot');
    const list = document.getElementById('list');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const segments = document.getElementById('segments');
    const sheetBg = document.getElementById('sheetBg');
    const addForm = document.getElementById('addForm');
    const countTotal = document.getElementById('countTotal');
    const countWatched = document.getElementById('countWatched');

    const GENRES = ['Action','Comedy','Drama','Horror','Romance','Sci-Fi','Thriller','Fantasy','Slice of Life','Animation','Mystery','Other'];
    const SCORES = ['-','10/10','9/10','8/10','7/10','6/10','5/10','4/10','3/10','2/10','1/10'];

    const PALETTE = [
      {bg:'#e2f1e8', fg:'#2e6b46'},
      {bg:'#e9f0f7', fg:'#3a6488'},
      {bg:'#faf1e4', fg:'#9c6b2a'},
      {bg:'#f2e8f4', fg:'#7a4a84'},
      {bg:'#e8f4ef', fg:'#2d6a5a'},
      {bg:'#f5ece0', fg:'#8a6535'},
      {bg:'#e9eef7', fg:'#4a5585'},
    ];

    function hash(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
      return Math.abs(h);
    }
    function coverFor(title) {
      const p = PALETTE[hash(title || '?') % PALETTE.length];
      const initial = (title || '?').trim().charAt(0).toUpperCase() || '?';
      return { bg: p.bg, fg: p.fg, initial };
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        dot.classList.add('on');
      } catch (e) { console.error(e); }
      loadData();
      setupEvents();
    });

    async function loadData() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('watchlist').select('*').order('created_at', { ascending: false });
          if (error) throw error;
          watchlistData = data || [];
        } catch (e) {
          console.error('Fetch failed, using local:', e);
          watchlistData = JSON.parse(localStorage.getItem('anjrel_watchlist_local') || '[]');
        }
      } else {
        watchlistData = JSON.parse(localStorage.getItem('anjrel_watchlist_local') || '[]');
      }
      render();
    }

    function saveLocal() { localStorage.setItem('anjrel_watchlist_local', JSON.stringify(watchlistData)); }

    function updateCounts() {
      countTotal.textContent = watchlistData.length;
      countWatched.textContent = watchlistData.filter(i => i.status === 'Watched').length;
    }

    function statusClass(s) {
      if (s === 'Watched') return 'watched';
      if (s === 'Still Watching') return 'watching';
      return 'will';
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    /* auto-grow a textarea to fit its content */
    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight) + 'px';
    }

    function render() {
      const q = searchInput.value.toLowerCase().trim();
      const filtered = watchlistData.filter(item => {
        const mf = currentFilter === 'All' || item.status === currentFilter;
        const ms = item.title.toLowerCase().includes(q) ||
                   (item.arel_notes && item.arel_notes.toLowerCase().includes(q)) ||
                   (item.anj_notes && item.anj_notes.toLowerCase().includes(q));
        return mf && ms;
      });

      list.innerHTML = '';

      if (filtered.length === 0) {
        list.style.display = 'none';
        emptyState.style.display = 'block';
      } else {
        list.style.display = 'block';
        emptyState.style.display = 'none';

        filtered.forEach(item => {
          const c = coverFor(item.title);
          const isOpen = openId === item.id;
          const row = document.createElement('div');
          row.className = 'row' + (isOpen ? ' open' : '');
          row.innerHTML = `
            <div class="row-head" data-id="${item.id}">
              <div class="badge" style="background:${c.bg};color:${c.fg}">${c.initial}</div>
              <div class="info">
                <div class="name">${escapeHtml(item.title)}</div>
                <div class="meta">
                  <span>${escapeHtml(item.type)}</span>
                  <span class="sep">·</span>
                  <span>${escapeHtml(item.genre)}</span>
                </div>
              </div>
              <div class="scores">
                <div class="score"><span>Arel</span><span>${escapeHtml(item.arel_score || '-')}</span></div>
                <div class="score"><span>Anj</span><span>${escapeHtml(item.anj_score || '-')}</span></div>
              </div>
              <span class="pill ${statusClass(item.status)}">${escapeHtml(item.status)}</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
            <div class="editor">
              <div class="field">
                <span class="label">Title</span>
                <input class="cell" type="text" value="${escapeHtml(item.title)}" onchange="updateItem('${item.id}','title',this.value)" />
              </div>
              <div class="grid2">
                <div class="field">
                  <span class="label">Type</span>
                  <select class="cell" onchange="updateItem('${item.id}','type',this.value)">
                    <option value="Movie" ${item.type==='Movie'?'selected':''}>Movie</option>
                    <option value="TV Show" ${item.type==='TV Show'?'selected':''}>TV Show</option>
                    <option value="Anime" ${item.type==='Anime'?'selected':''}>Anime</option>
                  </select>
                </div>
                <div class="field">
                  <span class="label">Genre</span>
                  <select class="cell" onchange="updateItem('${item.id}','genre',this.value)">
                    ${GENRES.map(g=>`<option value="${g}" ${item.genre===g?'selected':''}>${g}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="field">
                <span class="label">Status</span>
                <select class="cell" onchange="updateItem('${item.id}','status',this.value)">
                  <option value="Will Watch" ${item.status==='Will Watch'?'selected':''}>Will Watch</option>
                  <option value="Still Watching" ${item.status==='Still Watching'?'selected':''}>Still Watching</option>
                  <option value="Watched" ${item.status==='Watched'?'selected':''}>Watched</option>
                </select>
              </div>
              <div class="reviewer-block">
                <div class="reviewer-head">
                  <span class="reviewer-name">Arel</span>
                  <select class="cell" style="width:auto;padding:5px 26px 5px 9px;font-size:12.5px;" onchange="updateItem('${item.id}','arel_score',this.value)">
                    ${SCORES.map(s=>`<option value="${s}" ${item.arel_score===s?'selected':''}>${s}</option>`).join('')}
                  </select>
                </div>
                <textarea class="cell notes" rows="1" placeholder="Notes..." onchange="updateItem('${item.id}','arel_notes',this.value)" oninput="autoGrow(this)">${escapeHtml(item.arel_notes || '')}</textarea>
              </div>
              <div class="reviewer-block">
                <div class="reviewer-head">
                  <span class="reviewer-name">Anj</span>
                  <select class="cell" style="width:auto;padding:5px 26px 5px 9px;font-size:12.5px;" onchange="updateItem('${item.id}','anj_score',this.value)">
                    ${SCORES.map(s=>`<option value="${s}" ${item.anj_score===s?'selected':''}>${s}</option>`).join('')}
                  </select>
                </div>
                <textarea class="cell notes" rows="1" placeholder="Notes..." onchange="updateItem('${item.id}','anj_notes',this.value)" oninput="autoGrow(this)">${escapeHtml(item.anj_notes || '')}</textarea>
              </div>
              <div class="editor-actions">
                <button type="button" class="del" onclick="deleteItem('${item.id}')">Delete entry</button>
              </div>
            </div>
          `;

          row.querySelector('.row-head').addEventListener('click', () => {
            openId = (openId === item.id) ? null : item.id;
            render();
          });

          list.appendChild(row);

          /* size the textareas correctly once they're in the DOM */
          row.querySelectorAll('textarea.notes').forEach(t => autoGrow(t));
        });
      }

      updateCounts();
    }

    async function addItem(e) {
      e.preventDefault();
      const titleInput = document.getElementById('addTitle');
      const title = titleInput.value.trim();
      if (!title) return;

      const newItem = {
        id: crypto.randomUUID(),
        title,
        type: document.getElementById('addType').value,
        genre: document.getElementById('addGenre').value,
        status: document.getElementById('addStatus').value,
        arel_score: '-',
        anj_score: '-',
        arel_notes: '',
        anj_notes: '',
        created_at: new Date().toISOString()
      };

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('watchlist').insert([newItem]);
          if (error) throw error;
        } catch (e) { console.error('Insert failed:', e); }
      }

      watchlistData.unshift(newItem);
      saveLocal();
      titleInput.value = '';
      closeSheet();
      render();
    }

    async function updateItem(id, field, value) {
      const item = watchlistData.find(i => i.id === id);
      if (!item) return;
      item[field] = value;
      saveLocal();
      if (supabaseClient) {
        try {
          const p = {}; p[field] = value;
          await supabaseClient.from('watchlist').update(p).eq('id', id);
        } catch (e) { console.error('Update failed:', e); }
      }
      if (field === 'status' || field === 'title') render();
      else updateCounts();
    }

    async function deleteItem(id) {
      if (!confirm('Remove this entry?')) return;
      watchlistData = watchlistData.filter(i => i.id !== id);
      if (openId === id) openId = null;
      saveLocal();
      render();
      if (supabaseClient) {
        try { await supabaseClient.from('watchlist').delete().eq('id', id); }
        catch (e) { console.error('Delete failed:', e); }
      }
    }

    function openSheet() {
      sheetBg.classList.add('on');
      setTimeout(() => document.getElementById('addTitle').focus(), 250);
    }
    function closeSheet() {
      sheetBg.classList.remove('on');
    }

    function setupEvents() {
      addForm.addEventListener('submit', addItem);
      document.getElementById('fab').addEventListener('click', openSheet);
      sheetBg.addEventListener('click', (e) => { if (e.target === sheetBg) closeSheet(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

      searchInput.addEventListener('input', render);

      segments.addEventListener('click', (e) => {
        const btn = e.target.closest('.seg');
        if (!btn) return;
        document.querySelectorAll('.seg').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        currentFilter = btn.dataset.filter;
        openId = null;
        render();
      });
    }
  </script>
</body>
</html>
