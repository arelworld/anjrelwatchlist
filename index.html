<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>anjrel.mp4</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7fbf9;
      --surface-color: #ffffff;
      --border-color: #e2ece6;
      --border-hover: #c4dcd0;
      --text-main: #2d3832;
      --text-muted: #72847a;
      --accent-pastel: #dbece2;
      --accent-hover: #c8e2d2;
      --accent-active: #82b998;
      --accent-text: #225136;
      --row-hover: #f3f8f5;
      --danger-color: #d96b6b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.03);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Minimal Header */
    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 8px 0;
    }

    .app-title {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-text);
      letter-spacing: -0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #94a3b8;
      display: inline-block;
    }

    .status-dot.connected {
      background-color: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
    }

    /* Add Item Form Bar */
    .add-bar {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .form-input, .form-select {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: var(--font-sans);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent-active);
    }

    .form-input.title-input {
      flex: 2;
      min-width: 180px;
    }

    .btn {
      background: var(--accent-pastel);
      color: var(--accent-text);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: var(--accent-hover);
      border-color: var(--border-hover);
    }

    .btn-submit {
      font-weight: 600;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      max-width: 300px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid transparent;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: rgba(0,0,0,0.02);
    }

    .filter-btn.active {
      background: var(--accent-pastel);
      color: var(--accent-text);
      font-weight: 500;
    }

    /* Spreadsheet Table Area */
    .sheet-wrapper {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 950px;
    }

    .sheet-table th {
      background: #fafdfb;
      padding: 10px 12px;
      font-weight: 500;
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid #f0f4f2;
    }

    .sheet-table th:last-child {
      border-right: none;
    }

    .sheet-table td {
      padding: 6px 10px;
      border-bottom: 1px solid #f0f4f2;
      border-right: 1px solid #f0f4f2;
      vertical-align: middle;
    }

    .sheet-table td:last-child {
      border-right: none;
    }

    .sheet-table tr:last-child td {
      border-bottom: none;
    }

    .sheet-table tr:hover td {
      background-color: var(--row-hover);
    }

    /* Column Specifics */
    .col-title { width: 18%; }
    .col-type { width: 9%; }
    .col-genre { width: 10%; }
    .col-status { width: 11%; }
    .col-score { width: 8.5%; }
    .col-notes { width: 16%; }
    .col-action { width: 3%; text-align: center; }

    .cell-input, .cell-select {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 12px;
      font-family: var(--font-sans);
      color: var(--text-main);
      outline: none;
    }

    .cell-input:hover, .cell-select:hover {
      border-color: var(--border-hover);
      background: var(--surface-color);
    }

    .cell-input:focus, .cell-select:focus {
      border-color: var(--accent-active);
      background: var(--surface-color);
    }

    .cell-title {
      font-weight: 500;
    }

    /* Status Badges */
    .status-select {
      font-weight: 500;
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      text-align: center;
      cursor: pointer;
    }

    .status-will-watch { background-color: #f1f5f9; color: #475569; }
    .status-watching { background-color: #fef3c7; color: #92400e; }
    .status-watched { background-color: #dcfce7; color: #166534; }

    /* Score styling */
    .score-cell {
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-delete:hover {
      color: var(--danger-color);
      background: #fef2f2;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 12px 8px; }
      .add-bar { flex-direction: column; align-items: stretch; }
      .form-input.title-input { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header Title -->
    <header>
      <div class="app-title">
        anjrel.mp4
        <span class="status-dot" id="statusDot"></span>
      </div>
    </header>

    <!-- Quick Add Entry Bar -->
    <form class="add-bar" id="addForm">
      <input type="text" id="addTitle" class="form-input title-input" placeholder="Movie or Show title..." required />
      
      <select id="addType" class="form-select">
        <option value="Movie">Movie</option>
        <option value="TV Show">TV Show</option>
        <option value="Anime">Anime</option>
      </select>

      <select id="addGenre" class="form-select">
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama" selected>Drama</option>
        <option value="Horror">Horror</option>
        <option value="Romance">Romance</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Thriller">Thriller</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Slice of Life">Slice of Life</option>
        <option value="Animation">Animation</option>
        <option value="Mystery">Mystery</option>
        <option value="Other">Other</option>
      </select>

      <select id="addStatus" class="form-select">
        <option value="Will Watch" selected>Will Watch</option>
        <option value="Still Watching">Still Watching</option>
        <option value="Watched">Watched</option>
      </select>

      <button type="submit" class="btn btn-submit">+ Add Entry</button>
    </form>

    <!-- Search & Filter Bar -->
    <div class="controls-bar">
      <input type="text" id="searchInput" class="form-input search-box" placeholder="Search titles or notes..." />
      <div class="filter-group" id="filterGroup">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Will Watch">Will Watch</button>
        <button class="filter-btn" data-filter="Still Watching">Still Watching</button>
        <button class="filter-btn" data-filter="Watched">Watched</button>
      </div>
    </div>

    <!-- Spreadsheet Data Table -->
    <div class="sheet-wrapper">
      <table class="sheet-table">
        <thead>
          <tr>
            <th class="col-title">Title</th>
            <th class="col-type">Type</th>
            <th class="col-genre">Genre</th>
            <th class="col-status">Status</th>
            <th class="col-score">Arel Score</th>
            <th class="col-score">Anj Score</th>
            <th class="col-notes">Arel Notes</th>
            <th class="col-notes">Anj Notes</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Table Rows Injected Here -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display: none;">
        No watchlist entries found. Add your first item above!
      </div>
    </div>
  </div>

  <script>
    // Hardcoded Supabase Credentials
    const SUPABASE_URL = "https://ziqgknxgdmkkcacwbbqz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppcWdrbnhnZG1ra2NhY3diYnF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzg4ODksImV4cCI6MjEwNzkxNDg4OX0.cfdK306XrPS5B7aVTc2Uux9HAhvmVw3jwD3GHff7ovs";

    // State Variables
    let supabaseClient = null;
    let watchlistData = [];
    let currentFilter = 'All';

    // DOM Elements
    const statusDot = document.getElementById('statusDot');
    const tableBody = document.getElementById('tableBody');
    const emptyState = document.getElementById('emptyState');
    const addForm = document.getElementById('addForm');
    const searchInput = document.getElementById('searchInput');
    const filterGroup = document.getElementById('filterGroup');

    // Popular Genres & Score Options
    const GENRES = ['Action', 'Comedy', 'Drama', 'Horror', 'Romance', 'Sci-Fi', 'Thriller', 'Fantasy', 'Slice of Life', 'Animation', 'Mystery', 'Other'];
    const SCORES = ['-', '10/10', '9/10', '8/10', '7/10', '6/10', '5/10', '4/10', '3/10', '2/10', '1/10'];

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      initSupabase();
      loadData();
      setupEventListeners();
    });

    // Supabase Connection Init
    function initSupabase() {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        statusDot.classList.add('connected');
      } catch (err) {
        console.error("Supabase init error:", err);
        statusDot.classList.remove('connected');
      }
    }

    // Load Data (Remote or Local Fallback)
    async function loadData() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('watchlist').select('*').order('created_at', { ascending: false });
          if (error) throw error;
          watchlistData = data || [];
        } catch (err) {
          console.error("Cloud fetch error, loading local:", err);
          watchlistData = JSON.parse(localStorage.getItem('anjrel_watchlist_local') || '[]');
        }
      } else {
        watchlistData = JSON.parse(localStorage.getItem('anjrel_watchlist_local') || '[]');
      }
      renderTable();
    }

    // Save Data Locally as Fallback
    function saveLocal() {
      localStorage.setItem('anjrel_watchlist_local', JSON.stringify(watchlistData));
    }

    // Render Table Rows
    function renderTable() {
      tableBody.innerHTML = '';
      const query = searchInput.value.toLowerCase().trim();

      const filtered = watchlistData.filter(item => {
        const matchesFilter = currentFilter === 'All' || item.status === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              (item.arel_notes && item.arel_notes.toLowerCase().includes(query)) ||
                              (item.anj_notes && item.anj_notes.toLowerCase().includes(query));
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filtered.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>
              <input type="text" class="cell-input cell-title" value="${escapeHtml(item.title)}" onchange="updateItem('${item.id}', 'title', this.value)" />
            </td>
            <td>
              <select class="cell-select" onchange="updateItem('${item.id}', 'type', this.value)">
                <option value="Movie" ${item.type === 'Movie' ? 'selected' : ''}>Movie</option>
                <option value="TV Show" ${item.type === 'TV Show' ? 'selected' : ''}>TV Show</option>
                <option value="Anime" ${item.type === 'Anime' ? 'selected' : ''}>Anime</option>
              </select>
            </td>
            <td>
              <select class="cell-select" onchange="updateItem('${item.id}', 'genre', this.value)">
                ${GENRES.map(g => `<option value="${g}" ${item.genre === g ? 'selected' : ''}>${g}</option>`).join('')}
              </select>
            </td>
            <td>
              <select class="cell-select status-select ${getStatusClass(item.status)}" onchange="updateItem('${item.id}', 'status', this.value)">
                <option value="Will Watch" ${item.status === 'Will Watch' ? 'selected' : ''}>Will Watch</option>
                <option value="Still Watching" ${item.status === 'Still Watching' ? 'selected' : ''}>Still Watching</option>
                <option value="Watched" ${item.status === 'Watched' ? 'selected' : ''}>Watched</option>
              </select>
            </td>
            <td>
              <select class="cell-select score-cell" onchange="updateItem('${item.id}', 'arel_score', this.value)">
                ${SCORES.map(s => `<option value="${s}" ${item.arel_score === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
            <td>
              <select class="cell-select score-cell" onchange="updateItem('${item.id}', 'anj_score', this.value)">
                ${SCORES.map(s => `<option value="${s}" ${item.anj_score === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
            <td>
              <input type="text" class="cell-input" placeholder="Notes..." value="${escapeHtml(item.arel_notes || '')}" onchange="updateItem('${item.id}', 'arel_notes', this.value)" />
            </td>
            <td>
              <input type="text" class="cell-input" placeholder="Notes..." value="${escapeHtml(item.anj_notes || '')}" onchange="updateItem('${item.id}', 'anj_notes', this.value)" />
            </td>
            <td class="col-action">
              <button class="btn-delete" onclick="deleteItem('${item.id}')" title="Delete">✕</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }
    }

    // Helper functions
    function getStatusClass(status) {
      if (status === 'Watched') return 'status-watched';
      if (status === 'Still Watching') return 'status-watching';
      return 'status-will-watch';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Add Item
    async function addItem(e) {
      e.preventDefault();
      const titleInput = document.getElementById('addTitle');
      const title = titleInput.value.trim();
      if (!title) return;

      const newItem = {
        id: crypto.randomUUID(),
        title: title,
        type: document.getElementById('addType').value,
        genre: document.getElementById('addGenre').value,
        status: document.getElementById('addStatus').value,
        arel_score: '-',
        anj_score: '-',
        arel_notes: '',
        anj_notes: '',
        created_at: new Date().toISOString()
      };

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('watchlist').insert([newItem]);
          if (error) throw error;
        } catch (err) {
          console.error("Supabase insert error:", err);
        }
      }

      watchlistData.unshift(newItem);
      saveLocal();
      renderTable();
      titleInput.value = '';
    }

    // Update Field Inline
    async function updateItem(id, field, value) {
      const item = watchlistData.find(i => i.id === id);
      if (item) {
        item[field] = value;
        saveLocal();

        if (supabaseClient) {
          try {
            const updatePayload = {};
            updatePayload[field] = value;
            await supabaseClient.from('watchlist').update(updatePayload).eq('id', id);
          } catch (err) {
            console.error("Supabase update error:", err);
          }
        }
        if (field === 'status') renderTable();
      }
    }

    // Delete Item
    async function deleteItem(id) {
      if (!confirm("Remove this entry?")) return;
      watchlistData = watchlistData.filter(i => i.id !== id);
      saveLocal();
      renderTable();

      if (supabaseClient) {
        try {
          await supabaseClient.from('watchlist').delete().eq('id', id);
        } catch (err) {
          console.error("Supabase delete error:", err);
        }
      }
    }

    // Listeners
    function setupEventListeners() {
      addForm.addEventListener('submit', addItem);
      searchInput.addEventListener('input', renderTable);

      filterGroup.addEventListener('click', (e) => {
        if (e.target.classList.contains('filter-btn')) {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentFilter = e.target.getAttribute('data-filter');
          renderTable();
        }
      });
    }
  </script>
</body>
</html>
